[package]
name = "retroemu"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["gb-core", "gb-graphics"]

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
log = "0.4.35"
env_logger = "0.11.11"
gb-core = { path = "gb-core" }
gb-graphics = { path = "gb-graphics" }

[features]
verbose-logs = []
